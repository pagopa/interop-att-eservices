  postgres:
    image: postgres:14
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    command: -c 'max_connections=512' -c 'wal_level=logical'

networks:
  develop-network:
    name: interop-att-eservice-network
    driver: bridge

volumes:
  volume-redis: # Definizione del volume per Redis
    driver: local
