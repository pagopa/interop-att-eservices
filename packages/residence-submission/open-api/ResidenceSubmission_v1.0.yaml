openapi: 3.0.3
info:
  title: Residence Submission API
  description: |-
    Service for submitting, updating, and deleting residence information.
    
    **New:**
    - Added endpoint for deleting a user by ID (`DELETE /residence-submission/{id}`).
    - Improved error handling documentation for all endpoints, specifying error response structure and possible error codes.
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
  x-summary: Residence submission
servers:
  - url: 'http://eservices.att.interop.pagopa.it/'
    description: Attestation Environment
tags:
  - name: Residence Submission
    description: Submission and update of residence information
  - name: Health Check
    description: Service health check
security:
  - bearerAuth: []
  - Agid-JWT-Signature: []
paths:
  /residence-submission:
    post:
      tags:
        - Residence Submission
      summary: Upsert User
      description: Creates a user based on the provided criteria.
      operationId: upsertUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RichiestaAR003'
      responses:
        '200':
          description: Operation completed successfully
        '400':
          description: Invalid request parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
        - Residence Submission
      summary: Update User
      description: Updates an existing user based on the provided criteria.
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RichiestaAR003'
      responses:
        '200':
          description: Operation completed successfully
        '400':
          description: Invalid request parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /residence-submission/{id}:
    delete:
      tags:
        - Residence Submission
      summary: Delete User
      description: Deletes a user by their unique identifier.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '400':
          description: Invalid request parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /residence-submission/status:
    get:
      tags:
        - Health Check
      summary: Health status endpoint
      description: Return ok
      operationId: healthCheck
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
                  timestamp:
                    type: string
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    RichiestaAR003:
      type: object
      properties:
        idOp:
          type: string
        subjects:
          $ref: '#/components/schemas/TipoListaSoggetti'
    TipoListaSoggetti:
      type: object
      properties:
        subject:
          type: array
          items:
            $ref: '#/components/schemas/TipoDatiSoggettiEnte'
    TipoDatiSoggettiEnte:
      type: object
      properties:
        generality:
          $ref: '#/components/schemas/TipoGeneralita'
        address:
          type: array
          items:
            $ref: '#/components/schemas/TipoResidenza'
        identifiers:
          $ref: '#/components/schemas/TipoIdentificativi'
        deathDate:
          $ref: '#/components/schemas/TipoDatiEvento'
    TipoGeneralita:
      type: object
      properties:
        subjectId:
          $ref: '#/components/schemas/TipoCodiceFiscale'
        surname:
          type: string
        noSurname:
          type: string
        name:
          type: string
        noName:
          type: string
        gender:
          type: string
        birthDate:
          type: string
        noDay:
          type: string
        noMonth:
          type: string
        birthPlace:
          $ref: '#/components/schemas/TipoLuogoEvento'
        AIRESubject:
          type: string
        yearExpatriation:
          type: string
        idCommonSubjectData:
          $ref: '#/components/schemas/TipoIdSchedaSoggettoComune'
        idSubjectData:
          type: string
        note:
          type: string
    TipoCodiceFiscale:
      type: object
      properties:
        subjectId:
          type: string
        subjectIdValidity:
          type: string
        dataAttributionValidity:
          type: string
    TipoResidenza:
      type: object
      properties:
        addressType:
          type: string
        noteaddress:
          type: string
        address:
          $ref: '#/components/schemas/TipoIndirizzo'
        foreignState:
          $ref: '#/components/schemas/TipoLocalitaEstera1'
        presso:
          type: string
        addressStartDate:
          type: string
    TipoIndirizzo:
      type: object
      properties:
        cap:
          type: string
        municipality:
          $ref: '#/components/schemas/TipoComune'
        fraction:
          type: string
        toponym:
          $ref: '#/components/schemas/TipoToponimo'
        civicNumber:
          $ref: '#/components/schemas/TipoNumeroCivico'
    TipoComune:
      type: object
      properties:
        nameMunicipality:
          type: string
        istatCode:
          type: string
        acronymIstatProvince:
          type: string
        placeDescription:
          type: string
    TipoToponimo:
      type: object
      properties:
        codType:
          type: string
        type:
          type: string
        originType:
          type: string
        toponymCod:
          type: string
        toponymDenomination:
          type: string
        toponymSource:
          type: string
    TipoNumeroCivico:
      type: object
      properties:
        civicCod:
          type: string
        civicSource:
          type: string
        civicNumber:
          type: string
        metric:
          type: string
        progSNC:
          type: string
        letter:
          type: string
        exponent1:
          type: string
        color:
          type: string
        internalCivic:
          $ref: '#/components/schemas/TipoCivicoInterno'
    TipoCivicoInterno:
      type: object
      properties:
        court:
          type: string
        stairs:
          type: string
        internal1:
          type: string
        espInternal1:
          type: string
        internal2:
          type: string
        espInternal2:
          type: string
        externalStairs:
          type: string
        secondary:
          type: string
        floor:
          type: string
        nui:
          type: string
        isolated:
          type: string
    TipoLocalitaEstera1:
      type: object
      properties:
        foreignAddress:
          $ref: '#/components/schemas/TipoIndirizzoEstero'
        consulate:
          $ref: '#/components/schemas/TipoConsolato'
    TipoIndirizzoEstero:
      type: object
      properties:
        cap:
          type: string
        place:
          $ref: '#/components/schemas/TipoDatoLocalitaEstera'
        toponym:
          $ref: '#/components/schemas/TipoToponimoEstero'
    TipoConsolato:
      type: object
      properties:
        consulateCod:
          type: string
        consulateDescription:
          type: string
    TipoDatoLocalitaEstera:
      type: object
      properties:
        placeDescription:
          type: string
        countryDescription:
          type: string
        countryState:
          type: string
        provinceCounty:
          type: string
    TipoToponimoEstero:
      type: object
      properties:
        denomination:
          type: string
        civicNumber:
          type: string
    TipoDatiEvento:
      type: object
      properties:
        eventDate:
          type: string
        noDay:
          type: string
        noMonth:
          type: string
        eventPlace:
          $ref: '#/components/schemas/TipoLuogoEvento'
        eventAct:
          $ref: '#/components/schemas/TipoAttoEvento'
    TipoLuogoEvento:
      type: object
      properties:
        exceptionalPlace:
          type: string
        municipality:
          $ref: '#/components/schemas/TipoComune'
        place:
          $ref: '#/components/schemas/TipoLocalita'
    TipoAttoEvento:
      type: object
      properties:
        act:
          $ref: '#/components/schemas/TipoAtto'
        actANSC:
          $ref: '#/components/schemas/TipoAttoANSC'
    TipoAtto:
      type: object
      properties:
        municipalityRegistration:
          $ref: '#/components/schemas/TipoComune'
        municipalOffice:
          type: string
        year:
          type: string
        part:
          type: string
        series:
          type: string
        actNumber:
          type: string
        volume:
          type: string
        dateFormationAct:
          type: string
        transcribed:
          type: string
    TipoAttoANSC:
      type: object
      properties:
        idANSC:
          type: string
        municipalityRegistration:
          $ref: '#/components/schemas/TipoComune'
        act:
          type: string
        municipalOffice:
          type: string
        municipalNumber:
          type: string
        dateFormationAct:
          type: string
        transcribed:
          type: string
    TipoIdSchedaSoggettoComune:
      type: object
      properties:
        idCommonSubjectDataIstat:
          type: string
        idSubjectData:
          type: string
    TipoIdentificativi:
      type: object
      properties:
        id:
          type: string
    TipoErroriAnomalia:
      type: object
      properties:
        warningErrorCode:
          type: string
        warningErrorType:
          type: string
        warningErrorText:
          type: string
        warningErrorObject:
          type: string
        warningErrorField:
          type: string
        warningErrorValue:
          type: string
    TipoParametriRicercaAR001:
      type: object
      properties:
        subjectId:
          type: string
        id:
          type: string
        surname:
          type: string
        name:
          type: string
        gender:
          type: string
        birthDate:
          $ref: '#/components/schemas/TipoDatiNascitaE000'
    TipoDatiNascitaE000:
      type: object
      properties:
        eventDate:
          type: string
          format: date
        noDay:
          type: string
        noMonth:
          type: string
        birthPlace:
          $ref: '#/components/schemas/TipoLuogoNascitaE000'
    TipoLuogoNascitaE000:
      type: object
      properties:
        exceptionalPlace:
          type: string
        municipality:
          $ref: '#/components/schemas/TipoComune'
        place:
          $ref: '#/components/schemas/TipoLocalita'
    TipoLocalita:
      type: object
      properties:
        placeDescription:
          type: string
        countryDescription:
          type: string
        codState:
          type: string
        provinceCounty:
          type: string
    DataPreparationTemplate:
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/TipoCriteriRicercaTemplateAR001'
        address:
          $ref: '#/components/schemas/TipoResidenza'
    DataPreparationResponse:
      type: object
      properties:
        uuid:
          type: string
    DataPreparationTemplateResponse:
      type: object
      properties:
        uuid:
          type: string
        subject:
          $ref: '#/components/schemas/TipoCriteriRicercaTemplateAR001'
        address:
          $ref: '#/components/schemas/TipoResidenza'
    TipoCriteriRicercaTemplateAR001:
      type: object
      properties:
        subjectId:
          type: string
        id:
          type: string
        surname:
          type: string
        name:
          type: string
        gender:
          type: string
        birthDate:
          $ref: '#/components/schemas/TipoDatiNascitaTemplateE000'
    TipoDatiNascitaTemplateE000:
      type: object
      properties:
        eventDate:
          type: string
        birthPlace:
          $ref: '#/components/schemas/TipoLuogoNascitaE000'
    TipoRichiestaAR001:
      type: object
      properties:
        dateOfRequest:
          type: string
        motivation:
          type: string
        useCase:
          type: string
    TipoVerificaResidenza:
      type: object
      properties:
        tipoIndirizzo:
          type: string
    RichiestaAR001:
      type: object
      properties:
        operationId:
          type: string
        criteria:
          $ref: '#/components/schemas/TipoParametriRicercaAR001'
        requestData:
          $ref: '#/components/schemas/TipoRichiestaAR001'
    RispostaAR001:
      type: object
      properties:
        idOperazione:
          type: string
        soggetti:
          $ref: '#/components/schemas/TipoDatiSoggettiEnte'
        listaAnomalie:
          type: array
          items:
            $ref: '#/components/schemas/TipoErroriAnomalia'
    RichiestaAR002:
      type: object
    RispostaAR002OK:
      type: object
    Problem:
      type: object
      properties:
        type:
          type: string
        status:
          type: integer
        title:
          type: string
        correlationId:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'
    ProblemError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
    InfoSoggettoEnte:
      $ref: '#/components/schemas/TipoDatiSoggettiEnte'
    TipoInfoSoggetto:
      $ref: '#/components/schemas/TipoGeneralita'
    TipoLocalitaEstera:
      $ref: '#/components/schemas/TipoLocalitaEstera1'
  securitySchemes:
    bearerAuth:
      type: http
      description: 'A bearer token in the format of a JWS and conformed to the specifications included in [RFC8725](https://tools.ietf.org/html/RFC8725).'
      scheme: bearer
      bearerFormat: JWT
    Agid-JWT-Signature:
      type: apiKey
      in: header
      name: Agid-JWT-Signature
      description: |-
        JWS signature header. The value of this header represents a JWS signature. Refer to [integrity_rest_02] for information on the integrity of the REST message payload in PDND
    Agid-JWT-TrackingEvidence:
      type: apiKey
      in: header
      name: Agid-JWT-TrackingEvidence
      description: |-
        JWS signature header. The value of this header is a JWS signature. Refer to [audit_rest_02] for the forwarding of tracked data within the REST consumer's domain with correlation. Claims to include:
        userID: a unique identifier of the user within the consumer's domain who initiated the request for access to the provider's e-service;
        userLocation: a unique identifier of the workstation within the consumer's domain from which the request for access to the provider's e-service originated;
        LoA: the level of assurance or security adopted in the digital authentication process within the consumer's domain.