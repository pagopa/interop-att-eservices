apiVersion: apps/v1
kind: Deployment
metadata:
  name: interop-att-family-status
  namespace: {{NAMESPACE}}
  labels:
    app: interop-att-family-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interop-att-family-status
  template:
    metadata:
      labels:
        app: interop-att-family-status
    spec:
      serviceAccountName: {{SERVICEACCOUNT}}
      containers:
        - name: interop-att-family-status
#          image: ghcr.io/pagopa/interop-att-family-status:{{FAMILYSTATUSIMAGEDIGEST}}
          image: {{FAMILYSTATUSIMAGE}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 1.0
              memory: 2Gi
            limits:
              cpu: 1.0
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /family-status/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 120
          readinessProbe:
            httpGet:
              path: /family-status/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: info
          envFrom:
            - configMapRef:
                name: family-status-configmap
