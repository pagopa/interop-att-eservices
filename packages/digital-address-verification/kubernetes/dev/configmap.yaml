apiVersion: v1
kind: ConfigMap
metadata:
  name: digital-address-verification-configmap
  namespace: {{NAMESPACE}}
data:
  KMS_KEYID: '{{KMS_KEYID}}'
  DATABASE_URL: '{{DATABASE_URL}}'
  SKIP_JWT_VERIFICATION: false
  WELL_KNOWN_URLS: 'https://att.interop.pagopa.it/.well-known/jwks.json'
  TOKEN_ISS: 'att.interop.pagopa.it'
  TOKEN_AUD: 'interop-att-eservices-dig-addr-ver'
  TOKEN_TYP: 'at+jwt'
  KMS_MAX_ACQUISITION_TIMEOUT_SECONDS: 60
  DATABASE_HOST: '{{DATABASE_HOST}}'
  DATABASE_PORT: '{{DATABASE_PORT}}'
  DATABASE_USERNAME: '{{DATABASE_USERNAME}}'
  DATABASE_PASSWORD: '{{DATABASE_PASSWORD}}'
  DATABASE_NAME: '{{DATABASE_NAME}}'
  DATABASE_SCHEMA: '{{DATABASE_SCHEMA}}'
  DATABASE_SSL: '{{DATABASE_SSL}}'